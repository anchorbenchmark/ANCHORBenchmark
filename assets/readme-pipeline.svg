<g font-family="Arial, Helvetica, sans-serif" fill="#1d2933">
<text x="36" y="43" font-size="16" letter-spacing="1.8" fill="#66727d">THE EVALUATION WORKFLOW</text>
<g fill="#fff" stroke="#d6dde1"><rect x="36" y="76" width="260" height="137" rx="10"/><rect x="348" y="76" width="345" height="137" rx="10"/><rect x="745" y="76" width="419" height="137" rx="10"/></g>
<g font-size="15" letter-spacing="1.2" fill="#c41230"><text x="56" y="107">INPUT</text><text x="370" y="107">01 / GENERATE</text><text x="767" y="107">02 / PREPARE</text></g>
<g font-size="24" font-weight="700"><text x="56" y="145">Video + questions</text><text x="370" y="145">Model reasoning</text><text x="767" y="145">Scoring-ready JSON</text></g>
<g font-size="18" fill="#66727d"><text x="56" y="177">Local clips · JSONL</text><text x="370" y="177" font-family="monospace">eval_models.py</text><text x="767" y="177">One file per model + references</text></g>
<g fill="none" stroke="#a3283e" stroke-width="1.7" marker-end="url(#arrow)"><path d="M301 144H338"/><path d="M698 144H735"/><path d="M953 214V243H365V273"/><path d="M953 243V273"/></g>
<rect x="36" y="284" width="657" height="136" rx="10" fill="#fff" stroke="#d6dde1"/>
<text x="58" y="315" font-size="15" letter-spacing="1.2" fill="#c41230">03 / JUDGE</text>
<text x="58" y="352" font-size="24" font-weight="700">Answer · Hallucination · Divergence</text>
<text x="58" y="387" font-size="18" font-family="monospace" fill="#66727d">run_judges.py</text>
<rect x="745" y="284" width="419" height="247" rx="10" fill="#f9edef" stroke="#e8c4cb"/>
<text x="767" y="315" font-size="15" letter-spacing="1.2" fill="#c41230">04 / COUNT</text>
<text x="767" y="352" font-size="24" font-weight="700">Token conciseness</text>
<text x="767" y="387" font-size="18" font-family="monospace" fill="#66727d">run_token_conciseness.py</text>
<path d="M767 414H1142" stroke="#e8c4cb"/>
<text x="767" y="451" font-size="19">Deterministic · no LLM call</text>
<text x="767" y="484" font-size="18" fill="#66727d">Token counts + quintile scores</text>
