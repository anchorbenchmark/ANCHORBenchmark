<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">From video evidence to a reasoning audit</title>
<desc id="desc">Video and question annotations go through model inference. Regroup the JSONL predictions by model and attach reference reasoning to create scoring JSON arrays. These feed three LLM-judged facets and deterministic token conciseness in parallel. Analyze judge scores with weighted Cohen's kappa and score distributions.</desc>
